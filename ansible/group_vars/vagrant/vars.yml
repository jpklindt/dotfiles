caddy_base_domain: "127.0.0.1.nip.io"

nextcloud_domain: "nextcloud.{{ caddy_base_domain }}"
nextcloud_trusted_domains: "nextcloud.{{ caddy_base_domain }}"
nextcloud_overwrite_protocol: "http"

paperless_domain: "paperless.{{ caddy_base_domain }}"
paperless_allowed_hosts: "paperless.{{ caddy_base_domain }},localhost,127.0.0.1"
paperless_overwrite_protocol: "http"

authelia_domain: "auth.{{ caddy_base_domain }}"
authelia_cookie_domain: "{{ caddy_base_domain }}"

backup_drive_path: /dev/vdb
# data_drive_path: /dev/vdb
tailscale_authkey: "{{ vault_tailscale_vagrant_authkey }}"
tailscale_tag: "tag:vagrant"
