---
- name: Create Authelia directories
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ authelia_base_dir }}/{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ vault_admin_username }}"
    group: "{{ vault_admin_username }}"
    setype: container_file_t
  loop:
    - ""
    - config

- name: Template authelia config
  become: true
  ansible.builtin.template:
    src: configuration.yml.j2
    dest: "{{ authelia_base_dir }}/config/configuration.yml"
    mode: "0600"
  register: authelia_config

- name: Template authelia users database
  become: true
  ansible.builtin.template:
    src: users_database.yml.j2
    dest: "{{ authelia_base_dir }}/config/users_database.yml"
    mode: "0600"
  when: authelia_manage_users
  register: authelia_usersdb

- name: Deploy authelia quadlet
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/quadlet.yml"
  vars:
    quadlet_service: authelia.service
    quadlet_templates: [authelia.container]
    quadlet_extra_changed: >-
      {{ authelia_config is changed or authelia_usersdb is changed }}

- name: Assert authelia health before continuing
  ansible.builtin.uri:
    url: "http://localhost:{{ authelia_port }}/api/health"
    status_code: 200
  register: authelia_health
  until: authelia_health is succeeded
  retries: 12
  delay: 5
