---
# tasks file for roles/nextcloud

- name: Create Nextcloud base directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ global_hot_dir }}/nextcloud"
    state: directory
    mode: "0755"
    owner: "{{ vault_admin_username }}"
    group: "{{ vault_admin_username }}"

- name: Create Nextcloud HTML directory
  ansible.builtin.file:
    path: "{{ nextcloud_html_dir }}"
    state: directory
    mode: "0755"

- name: Create Nextcloud DB dump directory
  ansible.builtin.file:
    path: "{{ nextcloud_dump_dir }}"
    state: directory
    mode: "0700"

- name: Create Nextcloud data and db directories # noqa risky-file-permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ nextcloud_db_dir }}"
    - "{{ nextcloud_data_dir }}"

- name: Own data and html dirs as container www-data
  become: true
  become_method: containers.podman.podman_unshare
  ansible.builtin.file:
    path: "{{ item }}"
    owner: 33
    group: 33
  loop:
    - "{{ nextcloud_data_dir }}"
    - "{{ nextcloud_html_dir }}"

- name: Deploy nextcloud quadlets
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/quadlet.yml"
  vars:
    quadlet_service: nextcloud-pod.service
    quadlet_files: [nextcloud.pod, nextcloud-valkey.container]
    quadlet_templates:
      - nextcloud-cron.container
      - nextcloud-database.container
      - nextcloud-server.container

- name: Install nextcloud cron timer
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/user_units.yml"
  vars:
    user_unit_files: [nextcloud-cron.timer]
    user_unit_templates: [nextcloud-dump.service]
    user_unit_enable: [nextcloud-cron.timer]
