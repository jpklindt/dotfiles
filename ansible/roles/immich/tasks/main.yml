---
# tasks file for roles/immich

- name: Create Immich base directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ immich_base_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ vault_admin_username }}"
    group: "{{ vault_admin_username }}"

- name: Create Immich upload directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ immich_upload_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ vault_admin_username }}"
    group: "{{ vault_admin_username }}"

- name: Create Immich db directory
  ansible.builtin.file:
    path: "{{ immich_db_dir }}"
    state: directory

- name: Deploy immich quadlets
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/quadlet.yml"
  vars:
    quadlet_service: immich-pod.service
    quadlet_files: [immich.pod, immich-redis.container]
    quadlet_templates:
      - immich-server.container
      - immich-database.container
      - immich-machine-learning.container
