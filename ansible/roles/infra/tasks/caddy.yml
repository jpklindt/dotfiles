---
- name: Create appdata directories for Caddy
  become: true
  become_user: root
  ansible.builtin.file:
    path: "/srv/appdata/caddy/{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ vault_admin_username }}"
    group: "{{ vault_admin_username }}"
    setype: container_file_t
  loop:
    - ""
    - data
    - config
    - build

- name: Copy Caddyfile to appdata
  ansible.builtin.copy:
    src: "{{ 'Caddyfile.dev' if 'vagrant' in group_names else 'Caddyfile' }}"
    dest: "/srv/appdata/caddy/Caddyfile"
    mode: "0644"
  register: caddy_config

- name: Copy Dockerfile to server
  ansible.builtin.copy:
    src: "Dockerfile"
    dest: "/srv/appdata/caddy/build/Dockerfile"
    mode: "0644"
  register: caddy_dockerfile

- name: Build custom Caddy image with Porkbun
  containers.podman.podman_image:
    name: localhost/caddy-custom
    tag: latest
    path: "/srv/appdata/caddy/build"
    build:
      file: "/srv/appdata/caddy/build/Dockerfile"
    force: "{{ caddy_dockerfile is changed }}"
  register: caddy_image

- name: Generate .env file for Caddy container
  become: true
  ansible.builtin.template:
    src: env.j2
    dest: /srv/appdata/caddy/.env
    owner: "{{ vault_admin_username }}"
    group: "{{ vault_admin_username }}"
    mode: "0600"
  register: caddy_env

- name: Deploy caddy quadlet
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/quadlet.yml"
  vars:
    quadlet_service: caddy.service
    quadlet_files: [caddy.container]
    quadlet_extra_changed: >-
      {{ caddy_config is changed or caddy_image is changed or caddy_env is changed }}
