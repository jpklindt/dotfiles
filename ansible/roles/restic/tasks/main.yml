---
- name: Ensure config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "~/.config/restic"
    - "~/.config/rclone"
    - "~/.config/systemd/user"

- name: Write rclone config
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: "~/.config/rclone/rclone.conf"
    mode: "0600"
    force: false

- name: Write restic envs
  ansible.builtin.template:
    src: restic-env.j2
    dest: "~/.config/restic/{{ item.key}}.env"
    mode: "0600"
  loop: "{{ restic_repos | dict2items }}"

- name: Write path and exclude lists
  ansible.builtin.copy:
    dest: "~/.config/restic/{{ item.key }}"
    content: "{{ item.value | join('\n') }}\n"
    mode: "0600"
  loop: "{{ {'paths': restic_paths, 'excludes': restic_excludes} | dict2items }}"

- name: Ensure backup drive is mounted
  ansible.builtin.assert:
    that: ansible_mounts | selectattr('mount', 'equalto', global_backup_dir) | list | length > 0
    fail_msg: "{{ global_backup_dir }} is not mounted"

- name: Initialize restic repos
  ansible.builtin.command: restic init
  environment:
    RESTIC_REPOSITORY: "{{ item.value }}"
    RESTIC_PASSWORD: "{{ vault_restic_password }}"
  loop: "{{ restic_repos | dict2items }}"
  register: restic_init
  changed_when: restic_init.rc == 0
  failed_when: restic_init.rc != 0 and 'already exists' not in restic_init.stderr
  no_log: true

- name: Deploy backup services
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/user_units.yml"
  vars:
    user_unit_files: [restic-backup@.service, restic-backup@.timer]
    user_unit_enable: "{{ restic_repos | map('regex_replace', '^(.+)$', 'restic-backup@\\1.timer') | list }}"
